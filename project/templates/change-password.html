<!DOCTYPE html>
<html>
  <head>
    <title>Change Password</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container">
      <br /><br />
      <h1>Change Password</h1>
      <br /><br />

      <a class="btn btn-primary" role="button" href="{{ url_for('index') }}">Back</a>
      <br /><br />

      {% for message in get_flashed_messages() %}
      <div class="flash alert alert-success col-sm-4" role="success">
        {{ message }}
      </div>
      {% endfor %}

      <form
        action="{{ url_for('change_password_route') }}"
        method="post"
        class="change-password form-group"
      >
        <dl>
          <dt>New Password:</dt>
          <dd>
            <input
              type="password"
              size="30"
              name="password"
              class="form-control col-sm-4"
            />
          </dd>
          <br /><br />
          <dd>
            <input type="submit" class="btn btn-primary" value="Change" />
          </dd>
        </dl>
      </form>
    </div>
  </body>
</html>
